reset_monetary_costs:
  name: Reset monetary costs
  description: >
    Zero EUR cost counters and the current month's money totals. Energy (kWh)
    totals and processed interval IDs are kept so past intervals are not
    re-billed. Fix supplier prices first; this does not reprice history.
  fields:
    config_entry_id:
      name: Config entry
      description: Site config entry ID (required when more than one site exists).
      example: 01M6B7NF1TNSFTBJZ4DJB70PBZ
      selector:
        config_entry:
          integration: slovenian_energy_costs
